server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml text/xml;

    # Dashboard files: browsers re-check them on every load, so updates show without a hard refresh.
    # (add_header inside a location replaces the server-level ones, so they are repeated here.)
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ =404;
    }

    # Read-only OGC services (WMS, WFS GetFeature) proxied on the same origin: no CORS.
    location /geoserver/ {
        proxy_pass http://geoserver:8080/geoserver/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WFS-T edits: only POST, authenticated by Nginx with the editor account.
    location = /api/wfst {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        include /etc/nginx/snippets/editor-auth.conf;
        proxy_pass http://geoserver:8080/geoserver/demo/wfs;
        proxy_set_header Host $host;
        proxy_set_header Content-Type "text/xml";
    }
}
