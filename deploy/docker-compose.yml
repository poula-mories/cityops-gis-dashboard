# Public deployment: the CityOps container behind Caddy, which serves HTTPS with a free
# Let's Encrypt certificate. SITE_ADDRESS is the public host name, e.g. an sslip.io name for the
# server's IP (cityops.203-0-113-7.sslip.io) or your own domain pointed at the server.
#
# On the server, from the geo-stack folder:
#   SITE_ADDRESS=cityops.203-0-113-7.sslip.io docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS to the public host name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging: *logs

volumes:
  caddy_data:
  caddy_config:
