# Nginx for the single-container demo: serves the dashboard on port 7860 and passes only the public
# map services through to GeoServer. GeoServer's admin pages and REST API are not reachable.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml text/xml;

    server {
        listen 7860;
        root /app/site;
        index index.html;

        # Dashboard files: browsers re-check them on every load, so updates show without a hard refresh.
        location / {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri $uri/ =404;
        }

        # Read-only map services (WMS, WFS GetFeature) used by the dashboard, GET only.
        location ~ ^/geoserver/demo/(ows|wms|wfs)$ {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else under /geoserver (admin pages, REST API) stays private.
        location /geoserver/ { return 404; }

        # Edits: only POST, authenticated by Nginx with the editor account.
        location = /api/wfst {
            limit_except POST { deny all; }
            client_max_body_size 64k;
            include /tmp/editor-auth.conf;
            proxy_pass http://127.0.0.1:8080/geoserver/demo/wfs;
            proxy_set_header Content-Type "text/xml";
        }
    }
}
