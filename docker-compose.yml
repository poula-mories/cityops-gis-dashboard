# CityOps GIS dashboard: PostGIS + GeoServer + Nginx/Leaflet, configured automatically.
# Usage: cp .env.example .env && docker compose up -d   ->  http://localhost:8088

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  geoserver:
    image: docker.osgeo.org/geoserver:2.25.2
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      SKIP_DEMO_DATA: "true"
    volumes:
      - geoserver_data:/opt/geoserver_data
    depends_on:
      postgis:
        condition: service_healthy
    restart: unless-stopped

  # One-shot job: workspace, store, styles, layers, SQL views and security via the REST API.
  publish:
    image: curlimages/curl:8.8.0
    entrypoint: ["sh", "/scripts/publish.sh"]
    environment:
      GS_URL: http://geoserver:8080/geoserver
      GS_USER: ${GEOSERVER_ADMIN_USER}
      GS_PASS: ${GEOSERVER_ADMIN_PASSWORD}
      PG_DB: ${POSTGRES_DB}
      PG_USER: ${POSTGRES_USER}
      PG_PASS: ${POSTGRES_PASSWORD}
      EDITOR_USER: ${GEOSERVER_EDITOR_USER}
      EDITOR_PASSWORD: ${GEOSERVER_EDITOR_PASSWORD}
    volumes:
      - ./geoserver:/scripts:ro
    depends_on:
      - geoserver
    restart: "no"

  web:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    environment:
      EDITOR_USER: ${GEOSERVER_EDITOR_USER}
      EDITOR_PASSWORD: ${GEOSERVER_EDITOR_PASSWORD}
    volumes:
      - ./web/site:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/40-editor-auth.sh:/docker-entrypoint.d/40-editor-auth.sh:ro
    depends_on:
      - geoserver
    restart: unless-stopped

volumes:
  pgdata:
  geoserver_data:
